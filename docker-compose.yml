name: opspilot

x-backend-env: &backend-env
  OPSPILOT_ENVIRONMENT: local
  OPSPILOT_DATABASE_URL: postgresql+asyncpg://opspilot:${POSTGRES_PASSWORD:-opspilot-local}@postgres:5432/opspilot
  OPSPILOT_REDIS_URL: redis://redis:6379/0
  OPSPILOT_S3_ENDPOINT_URL: http://s3:9000
  OPSPILOT_S3_BUCKET: opspilot-artifacts
  OPSPILOT_S3_SERVER_SIDE_ENCRYPTION: ""
  OPSPILOT_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-opspilot}
  OPSPILOT_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-opspilot-local-secret}
  OPSPILOT_JWT_SECRET: ${OPSPILOT_JWT_SECRET:?set OPSPILOT_JWT_SECRET in .env}
  OPSPILOT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPSPILOT_EMBEDDING_CACHE_DIR: /models
  OPSPILOT_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OPSPILOT_RATE_LIMIT_LOGIN_PER_MINUTE: ${OPSPILOT_RATE_LIMIT_LOGIN_PER_MINUTE:-10}
  OPSPILOT_MCP_VERIFY_PUBLIC_KEY: ${OPSPILOT_MCP_VERIFY_PUBLIC_KEY:?set in .env}
  OPSPILOT_CONTROL_PLANE_READ_TOKEN: ${CONTROL_PLANE_READ_TOKEN}
  OPSPILOT_GITHUB_REPOSITORIES: '{"opspilot-demo/orders-api": {"provider": "local", "path": "/repos/orders-api", "workspaces": "*"}, "opspilot-demo/checkout-api": {"provider": "local", "path": "/repos/checkout-api", "workspaces": "*"}}'

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot-local}
      POSTGRES_DB: opspilot
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # S3-compatible object store for local development (SeaweedFS S3 gateway).
  # The application uses the same boto3 S3 client against AWS S3 in the cloud.
  s3:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s/\$${S3_ACCESS_KEY}/$$S3_ACCESS_KEY/" -e "s/\$${S3_SECRET_KEY}/$$S3_SECRET_KEY/"
        /config/s3.json.tmpl > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=64 -volume.max=64
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-opspilot}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-opspilot-local-secret}
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - s3data:/data
      - ./infra/local/seaweedfs-s3.json.tmpl:/config/s3.json.tmpl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/healthz || exit 1"]
      interval: 3s
      retries: 30

  migrate:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m opspilot.cli bootstrap"]
    environment: *backend-env
    volumes: [models:/models]
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
      redis: {condition: service_healthy}

  # One-shot: creates the labelled demo workspace/users and queues the demo corpus for ingestion.
  seed:
    build: ./backend
    command: ["python", "-m", "opspilot.cli", "seed-demo"]
    environment:
      <<: *backend-env
      OPSPILOT_DEMO_PASSWORD: ${OPSPILOT_DEMO_PASSWORD:-opspilot-demo-password}
    volumes: [models:/models, ./demo/docs:/demo/docs:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
    profiles: [demo]

  api:
    build: ./backend
    command: ["uvicorn", "opspilot.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "20"]
    environment:
      <<: *backend-env
      OPSPILOT_MCP_SIGNING_PRIVATE_KEY: ${OPSPILOT_MCP_SIGNING_PRIVATE_KEY:?set in .env}
      OPSPILOT_CONTROL_PLANE_ADMIN_TOKEN: ${CONTROL_PLANE_ADMIN_TOKEN}
    ports: ["127.0.0.1:8000:8000"]
    volumes: [models:/models]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 20

  worker:
    build: ./backend
    command: ["python", "-m", "opspilot.cli", "worker"]
    environment: *backend-env
    volumes: [models:/models]
    stop_grace_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}

  # Runs agent turns (Claude Agent SDK + bundled CLI). Holds the model API key and the MCP signing key;
  # has no built-in tools enabled and reaches only the MCP servers.
  agent-worker:
    build: ./backend
    command: ["python", "-m", "opspilot.cli", "agent-worker"]
    environment:
      <<: *backend-env
      OPSPILOT_MCP_SIGNING_PRIVATE_KEY: ${OPSPILOT_MCP_SIGNING_PRIVATE_KEY}
    stop_grace_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}

  # ---------------------------------------------------------------------------------------------
  # MCP servers (Streamable HTTP). Each verifies EdDSA tool tokens minted by the API (public key only).
  # ---------------------------------------------------------------------------------------------
  mcp-knowledge:
    build: ./backend
    ports: ["127.0.0.1:8101:8101"]
    command: ["python", "-m", "opspilot.mcpservers.knowledge"]
    environment: *backend-env
    volumes: [models:/models]
    depends_on: {migrate: {condition: service_completed_successfully}}

  mcp-github:
    build: ./backend
    ports: ["127.0.0.1:8102:8102"]
    command: ["python", "-m", "opspilot.mcpservers.github"]
    environment:
      OPSPILOT_MCP_VERIFY_PUBLIC_KEY: ${OPSPILOT_MCP_VERIFY_PUBLIC_KEY}
      OPSPILOT_JWT_SECRET: ${OPSPILOT_JWT_SECRET}
      OPSPILOT_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OPSPILOT_GITHUB_REPOSITORIES: '{"opspilot-demo/orders-api": {"provider": "local", "path": "/repos/orders-api", "workspaces": "*"}, "opspilot-demo/checkout-api": {"provider": "local", "path": "/repos/checkout-api", "workspaces": "*"}}'
    volumes: [demorepos:/repos:ro]
    depends_on: {control-plane: {condition: service_healthy}}

  mcp-observability:
    build: ./backend
    ports: ["127.0.0.1:8103:8103"]
    command: ["python", "-m", "opspilot.mcpservers.observability"]
    environment:
      OPSPILOT_MCP_VERIFY_PUBLIC_KEY: ${OPSPILOT_MCP_VERIFY_PUBLIC_KEY}
      OPSPILOT_JWT_SECRET: ${OPSPILOT_JWT_SECRET}
      OPSPILOT_CONTROL_PLANE_READ_TOKEN: ${CONTROL_PLANE_READ_TOKEN}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on: [prometheus, loki, control-plane]

  mcp-operations:
    build: ./backend
    ports: ["127.0.0.1:8104:8104"]
    command: ["python", "-m", "opspilot.mcpservers.operations"]
    environment:
      <<: *backend-env
      # The only holder of the deploy token: the sole path to a mutation in the demo environment.
      OPSPILOT_CONTROL_PLANE_DEPLOY_TOKEN: ${CONTROL_PLANE_DEPLOY_TOKEN}
    depends_on:
      migrate: {condition: service_completed_successfully}
      control-plane: {condition: service_healthy}

  # ---------------------------------------------------------------------------------------------
  # Isolated demo environment (fictional services). The control plane is the only system the
  # operations MCP server can change, and only with the deploy token.
  # ---------------------------------------------------------------------------------------------
  control-plane:
    build: ./demo
    command: ["uvicorn", "demo.control_plane.app:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      CONTROL_PLANE_READ_TOKEN: ${CONTROL_PLANE_READ_TOKEN:?set in .env}
      CONTROL_PLANE_DEPLOY_TOKEN: ${CONTROL_PLANE_DEPLOY_TOKEN:?set in .env}
      CONTROL_PLANE_ADMIN_TOKEN: ${CONTROL_PLANE_ADMIN_TOKEN:?set in .env}
      DEMO_REPOS_DIR: /repos
    volumes: [controlplane:/data, demorepos:/repos]
    ports: ["127.0.0.1:8090:8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 3s
      retries: 20

  orders-api:
    build: ./demo
    command: ["uvicorn", "demo.services.app:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning"]
    environment: &demo-svc-env
      SERVICE_NAME: orders-api
      CONTROL_PLANE_URL: http://control-plane:8090
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
    depends_on: {control-plane: {condition: service_healthy}}

  checkout-api:
    build: ./demo
    command: ["uvicorn", "demo.services.app:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning"]
    environment:
      <<: *demo-svc-env
      SERVICE_NAME: checkout-api
    depends_on: {control-plane: {condition: service_healthy}}

  traffic:
    build: ./demo
    command: ["python", "-m", "demo.services.traffic"]
    depends_on: [orders-api, checkout-api]

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes: [./infra/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro, promdata:/prometheus]
    ports: ["127.0.0.1:9090:9090"]

  loki:
    image: grafana/loki:3.7.9
    ports: ["127.0.0.1:3100:3100"]
    volumes: [lokidata:/loki]

  # Optional trace viewer: `docker compose --profile observability up -d jaeger` and set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env, then restart the backend services.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]
    profiles: [observability]

volumes:
  pgdata:
  redisdata:
  s3data:
  models:
  controlplane:
  demorepos:
  promdata:
  lokidata:
